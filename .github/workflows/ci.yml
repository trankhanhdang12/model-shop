
name: TKD-Shop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check services/pricing.js

      - name: Run Unit Tests
        run: node --test tests/discount.test.js tests/shipping.test.js

      - name: Run Code Coverage
        run: node --experimental-test-coverage --test tests/discount.test.js tests/shipping.test.js
